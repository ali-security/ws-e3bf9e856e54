name: CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Mocha --grep pattern; empty runs the full suite'
        required: false
        default: ''

permissions: {}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        arch:
          - x64
          - x86
        node:
          - 10
          - 12
          - 14
          - 16
          - 18
          - 19
        os:
          - macOS-latest
          - ubuntu-latest
          - windows-latest
        exclude:
          - arch: x86
            os: macOS-latest
          - arch: x86
            os: ubuntu-latest
          - arch: x86
            node: 18
            os: windows-latest
          - node: 10
            os: macOS-latest
          - node: 12
            os: macOS-latest
          - node: 14
            os: macOS-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ runner.os == 'macOS' && '' || matrix.arch }}
      - name: Pin the npm registry to the release date
        run: |
          npm config set registry https://time-machines-npm.sealsecurity.io/
          npm config set //time-machines-npm.sealsecurity.io/:_authToken=2022-11-06T20:02:55.232000Z
        shell: bash
      - run: npm install
      - name: Run the test suite
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npx mocha --throw-deprecation test/*.test.js --grep "${{ inputs.test-filter }}"
          else
            npm test
          fi
        shell: bash
      - name: Pack the release tarball
        if:
          matrix.os == 'ubuntu-latest' && matrix.node == 18 && matrix.arch ==
          'x64'
        run: npm pack
      - uses: actions/upload-artifact@v4
        if:
          matrix.os == 'ubuntu-latest' && matrix.node == 18 && matrix.arch ==
          'x64'
        with:
          name: npm-tarball
          path: '*.tgz'
          if-no-files-found: error
